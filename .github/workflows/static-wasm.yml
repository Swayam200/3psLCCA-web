name: Static WebAssembly CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  static-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the WebAssembly-enabled core
        uses: actions/checkout@v4
        with:
          repository: Swayam200/3psLCCA-core
          ref: feat/wasm-static-runtime
          path: 3psLCCA-gui-python-venv/3psLCCA-core

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        run: python -m pip install build setuptools-scm

      - name: Install web dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run JavaScript tests
        run: npm test

      - name: Lint WebAssembly integration
        run: npm run lint:wasm

      - name: Build the self-contained static site
        env:
          LCCA_CORE_PATH: 3psLCCA-gui-python-venv/3psLCCA-core
          LCCA_PYTHON: python
        run: npm run build

      - name: Verify static WebAssembly calculation
        run: npm run test:wasm

      - name: Build for subdirectory hosting
        env:
          LCCA_CORE_PATH: 3psLCCA-gui-python-venv/3psLCCA-core
          LCCA_PYTHON: python
          VITE_BASE_PATH: /lcca/
        run: npm run build -- --outDir "$RUNNER_TEMP/subdir/lcca"

      - name: Verify subdirectory deployment
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4174/lcca/
          PLAYWRIGHT_SERVER_COMMAND: python -m http.server 4174 --directory ${{ runner.temp }}/subdir
        run: npx playwright test tests/wasm-static.spec.js

      - uses: actions/upload-artifact@v4
        with:
          name: 3pslcca-static-dist
          path: dist
