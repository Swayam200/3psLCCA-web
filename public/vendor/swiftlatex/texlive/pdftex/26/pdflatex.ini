% tex-ini-files 2023-11-17: pdflatex.ini

% Thomas Esser, 1998. public domain.
\input pdftexconfig.tex
% Web-engine compatibility (see docs/report-latex-web-plan.md): the wasm
% pdfTeX predates the \partokencontext primitive (TeX Live 2025), but the
% vendored 2026 macro tree assumes any 2024/06+ format has it (microtype's
% \MT@suspend@tagging assigns to it unguarded). Alias it to the scratch
% count register so those assignments become harmless no-ops.
\ifdefined\partokencontext\else
  \countdef\partokencontext=255
\fi
\input latex.ltx
\endinput
